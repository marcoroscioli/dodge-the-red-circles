<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dodge</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Base resolution for scaling
        const BASE_WIDTH = 800;
        const BASE_HEIGHT = 400;
        let scaleX = 1;
        let scaleY = 1;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            scaleX = canvas.width / BASE_WIDTH;
            scaleY = canvas.height / BASE_HEIGHT;
        }

        // Initial resize and handle window resize
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Constants (in base resolution units)
        const PLAYER_SIZE = 25;
        const OBSTACLE_SIZE = 15;
        const INITIAL_SPEED = 2.5;
        const INITIAL_SPAWN_INTERVAL = 800; // ms
        const MIN_SPAWN_INTERVAL = 50; // Prevent unplayable spawn rates
        const MAX_OBSTACLES = 10; // Limit to 10 red balls

        // Colors
        const NEON_GREEN = '#39FF14';
        const NEON_RED = '#FF3333';
        const DARK_BG = '#0F0F1A';

        // Game state (in base resolution units)
        let player = { x: BASE_WIDTH / 4, y: BASE_HEIGHT / 2 };
        let obstacles = [];
        let particles = [];
        let score = 0;
        let speed = INITIAL_SPEED;
        let spawnInterval = INITIAL_SPAWN_INTERVAL;
        let lastSpawnTime = performance.now();
        let gameOver = false;

        // Mouse input (convert to base resolution)
        canvas.addEventListener('mousemove', (e) => {
            if (!gameOver) {
                const rect = canvas.getBoundingClientRect();
                player.x = (e.clientX - rect.left) / scaleX;
                player.y = (e.clientY - rect.top) / scaleY;
                player.x = Math.max(PLAYER_SIZE / 2, Math.min(BASE_WIDTH - PLAYER_SIZE / 2, player.x));
                player.y = Math.max(PLAYER_SIZE / 2, Math.min(BASE_HEIGHT - PLAYER_SIZE / 2, player.y));
            }
        });

        // Restart on F5
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F5') {
                e.preventDefault();
                restartGame();
            }
        });

        function restartGame() {
            player = { x: BASE_WIDTH / 4, y: BASE_HEIGHT / 2 };
            obstacles = [];
            particles = [];
            score = 0;
            speed = INITIAL_SPEED;
            spawnInterval = INITIAL_SPAWN_INTERVAL;
            lastSpawnTime = performance.now();
            gameOver = false;
            requestAnimationFrame(gameLoop);
        }

        function spawnObstacle() {
            if (obstacles.length < MAX_OBSTACLES) {
                const y = Math.random() * (BASE_HEIGHT - OBSTACLE_SIZE) + OBSTACLE_SIZE / 2;
                obstacles.push({ x: BASE_WIDTH, y, speed: speed + Math.random() * 0.5 });
                speed += 0.1;
            }
        }

        function spawnParticles(x, y) {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3,
                    life: 20
                });
            }
        }

        function update(timestamp) {
            if (gameOver) return;

            // Spawn obstacles
            if (timestamp - lastSpawnTime >= spawnInterval) {
                spawnObstacle();
                lastSpawnTime = timestamp;
            }

            // Move obstacles
            obstacles.forEach(obs => obs.x -= obs.speed);

            // Check collisions
            obstacles.forEach(obs => {
                const dx = player.x - obs.x;
                const dy = player.y - obs.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < (PLAYER_SIZE + OBSTACLE_SIZE) / 2) {
                    gameOver = true;
                }
            });

            // Score and particles for passed obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                if (obstacles[i].x < -OBSTACLE_SIZE) {
                    score += 10;
                    spawnInterval = Math.max(MIN_SPAWN_INTERVAL, spawnInterval / 2); // Double spawn rate
                    spawnParticles(obstacles[i].x, obstacles[i].y);
                    obstacles.splice(i, 1);
                }
            }

            // Update particles
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function draw() {
            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1C2526');
            gradient.addColorStop(1, DARK_BG);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Animated grid
            ctx.strokeStyle = 'rgba(57, 255, 20, 0.2)';
            ctx.lineWidth = 1 * scaleY;
            for (let y = 0; y < BASE_HEIGHT; y += 20) {
                ctx.beginPath();
                ctx.moveTo(0, (y + (frameCount % 20)) * scaleY);
                ctx.lineTo(canvas.width, (y + (frameCount % 20)) * scaleY);
                ctx.stroke();
            }

            // Player
            ctx.fillStyle = NEON_GREEN;
            ctx.fillRect(
                (player.x - PLAYER_SIZE / 2) * scaleX,
                (player.y - PLAYER_SIZE / 2) * scaleY,
                PLAYER_SIZE * scaleX,
                PLAYER_SIZE * scaleY
            );

            // Obstacles
            obstacles.forEach(obs => {
                ctx.fillStyle = NEON_RED;
                ctx.beginPath();
                ctx.arc(
                    obs.x * scaleX,
                    obs.y * scaleY,
                    (OBSTACLE_SIZE / 2) * scaleX,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            });

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = `rgba(57, 255, 20, ${p.life / 20})`;
                ctx.beginPath();
                ctx.arc(
                    p.x * scaleX,
                    p.y * scaleY,
                    2 * scaleX,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            });

            // UI with glow
            ctx.font = `${24 * scaleY}px Orbitron`;
            ctx.fillStyle = '#FFF';
            ctx.shadowColor = NEON_GREEN;
            ctx.shadowBlur = 10 * scaleY;
            ctx.fillText(`Score: ${score}`, 10 * scaleX, 30 * scaleY);
            ctx.shadowBlur = 0;

            if (gameOver) {
                ctx.fillStyle = NEON_RED;
                ctx.font = `${40 * scaleY}px Orbitron`;
                ctx.shadowColor = NEON_RED;
                ctx.shadowBlur = 15 * scaleY;
                ctx.fillText('Game Over', (BASE_WIDTH / 2 - 100) * scaleX, (BASE_HEIGHT / 2) * scaleY);
                ctx.font = `${20 * scaleY}px Orbitron`;
                ctx.fillText('Press F5 to Restart', (BASE_WIDTH / 2 - 80) * scaleX, (BASE_HEIGHT / 2 + 40) * scaleY);
                ctx.shadowBlur = 0;
            }
        }

        let frameCount = 0;
        function gameLoop(timestamp) {
            frameCount++;
            update(timestamp);
            draw();
            if (!gameOver) requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
